<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
  <title id="title">Heet Parikh field notes</title>
  <desc id="desc">A hand-drawn engineering notebook header with a quadcopter sketch, a wafer map, labels, and colored ink marks.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#52627A" stroke-width="0.8" opacity=".16"/>
      <circle cx="0" cy="0" r="1.2" fill="#52627A" opacity=".2"/>
    </pattern>
    <pattern id="speckle" width="43" height="37" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r=".8" fill="#8F785C" opacity=".18"/>
      <circle cx="29" cy="19" r=".6" fill="#8F785C" opacity=".15"/>
      <path d="M14 31l3-1" stroke="#8F785C" stroke-width=".7" opacity=".17"/>
    </pattern>
    <clipPath id="paper"><rect x="0" y="0" width="1400" height="390" rx="5"/></clipPath>
  </defs>
  <g clip-path="url(#paper)">
    <rect width="1400" height="390" fill="#F2E8D5"/>
    <rect width="1400" height="390" fill="url(#grid)"/>
    <rect width="1400" height="390" fill="url(#speckle)"/>

    <!-- ink frame and registration marks -->
    <path d="M28 30H1372V360H28Z" fill="none" stroke="#272C3B" stroke-width="2.2"/>
    <path d="M42 43h26m-13-13v26M1332 43h26m-13-13v26M42 347h26m-13-13v26M1332 347h26m-13-13v26" fill="none" stroke="#E36A4B" stroke-width="2.2"/>
    <path d="M790 55V336" stroke="#272C3B" stroke-width="1.5" stroke-dasharray="3 7" opacity=".55"/>

    <!-- left text block -->
    <rect x="72" y="64" width="188" height="27" rx="2" fill="#D9E36A" transform="rotate(-1.5 72 64)"/>
    <text x="84" y="83" fill="#272C3B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">PERSONAL WORKBOOK / 01</text>
    <text x="68" y="175" fill="#272C3B" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" letter-spacing="-3">HEET PARIKH</text>
    <path d="M73 195Q296 207 550 194" fill="none" stroke="#E36A4B" stroke-width="5" stroke-linecap="round"/>
    <text x="75" y="238" fill="#315AA6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="3.2">SOFTWARE  /  AI  /  ROBOTICS</text>
    <text x="76" y="278" fill="#272C3B" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">Notes from the screen, the lab, and the workbench.</text>
    <text x="76" y="327" fill="#6B675F" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">CSPIT · CHARUSAT     /     COMPUTER SCIENCE</text>

    <!-- small ink swatches -->
    <circle cx="615" cy="323" r="8" fill="#E36A4B"/>
    <circle cx="642" cy="323" r="8" fill="#315AA6"/>
    <circle cx="669" cy="323" r="8" fill="#D9E36A" stroke="#272C3B" stroke-width="1"/>
    <circle cx="696" cy="323" r="8" fill="#8C72A8"/>

    <!-- right technical sketch: quadcopter top view -->
    <g transform="translate(1030 190) rotate(-5)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="132" stroke="#315AA6" stroke-width="1.2" stroke-dasharray="4 7" opacity=".55"/>
      <circle cx="0" cy="0" r="104" stroke="#315AA6" stroke-width="1" opacity=".35"/>
      <path d="M-92 -92L92 92M-92 92L92 -92" stroke="#315AA6" stroke-width="5" opacity=".85"/>
      <path d="M-98 -98L-80 -80M98 -98L80 -80M-98 98L-80 80M98 98L80 80" stroke="#E36A4B" stroke-width="3"/>
      <g stroke="#272C3B" stroke-width="2.4">
        <circle cx="-102" cy="-102" r="31"/><circle cx="102" cy="-102" r="31"/>
        <circle cx="-102" cy="102" r="31"/><circle cx="102" cy="102" r="31"/>
        <path d="M-120 -102h36M-102 -120v36M84 -102h36M102 -120v36M-120 102h36M-102 84v36M84 102h36M102 84v36" stroke-width="1.3" opacity=".8"/>
      </g>
      <path d="M-43 -25L-24 -45H24L43 -25V28L23 46H-24L-43 27Z" fill="#D9E36A" stroke="#272C3B" stroke-width="2.4"/>
      <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#E36A4B" stroke="#272C3B" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#F2E8D5" stroke="#272C3B" stroke-width="1.5"/>
      <path d="M0 -47V-70M0 47V70M-47 0H-70M47 0H70" stroke="#272C3B" stroke-width="1.5" stroke-dasharray="3 4"/>
    </g>

    <!-- callouts and wafer map -->
    <path d="M1110 54L1161 35L1226 35" fill="none" stroke="#E36A4B" stroke-width="2"/>
    <text x="1233" y="39" fill="#E36A4B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">FIELD TEST / A</text>
    <path d="M1140 296L1190 324L1260 324" fill="none" stroke="#315AA6" stroke-width="2"/>
    <text x="1268" y="328" fill="#315AA6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">FLIGHT LOG</text>

    <g transform="translate(865 285)">
      <circle cx="0" cy="0" r="43" fill="#F2E8D5" stroke="#8C72A8" stroke-width="2"/>
      <path d="M-30 -30H30V30H-30Z M-10 -30V30M10 -30V30M-30 -10H30M-30 10H30" fill="none" stroke="#8C72A8" stroke-width="1" opacity=".8"/>
      <circle cx="10" cy="-10" r="7" fill="#E36A4B" opacity=".9"/>
      <path d="M47 -4L93 -31" fill="none" stroke="#8C72A8" stroke-width="1.5" stroke-dasharray="3 4"/>
      <text x="-35" y="62" fill="#8C72A8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">WAFER MAP</text>
    </g>

  </g>
</svg>
